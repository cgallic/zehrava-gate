# Demo policy showing the A2H/Ola bridge provider (issue #7). Unlike
# kaicalls, the external gateway issues its own signed decision: Gate sends
# an A2H v1.0 AUTHORIZE and verifies the gateway's RESPONSE (webhook signed
# with GATE_PROVIDER_SECRET_A2H, or a status poll). Not wired into any real
# production destination — placeholder gateway URL. For a runnable version
# against a local gateway, see examples/ola-a2h/.
id: a2h-bridge-demo
require_approval: always
destinations:
  - stripe.refund
  - finance.payout
expiry_minutes: 30
approval_channel:
  provider: a2h
  a2h:
    gateway_url: "https://a2h.example.com/v1/authorize"
    gateway_id: "ola-demo"
assurance:
  low: []
  medium: [a2h.signed_response.v1]
  high: [a2h.signed_response.v1]
  critical: [a2h.signed_response.v1]
